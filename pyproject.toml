[project]
name = "distributed-job-queue"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jayqss", email = "joellkebret05@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.0",
    "fastapi>=0.162.2",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
distributed-job-queue = "distributed_job_queue:main"

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires live PostgreSQL and Redis"]
addopts = "-ra"
